{# List <-> calendar switch, shown on phones only (the masthead links do the
   same on wider screens). Both keep the filters. #}
<nav class="tabs" aria-label="Vista">
  <a href="{{ filters.url(view='list') }}"{% if filters.view == 'list' %} class="is-active" aria-current="page"{% endif %}>Lista</a>
  <a href="{{ filters.url(view='calendar') }}"{% if filters.view == 'calendar' %} class="is-active" aria-current="page"{% endif %}>Calendário</a>
</nav>
