{# List <-> calendar switch, shown on phones only (the masthead links do the
   same on wider screens). Keeps the district filter (`slug`, empty for all
   districts) across the switch; `view_mode` is "list" or "calendar". #}
<nav class="tabs" aria-label="Vista">
  <a href="{{ '/distrito/' ~ slug if slug else '/' }}"{% if view_mode == 'list' %} class="is-active" aria-current="page"{% endif %}>Lista</a>
  <a href="{{ '/calendario?distrito=' ~ slug if slug else '/calendario' }}"{% if view_mode == 'calendar' %} class="is-active" aria-current="page"{% endif %}>Calendario</a>
</nav>
